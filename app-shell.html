const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const dayKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dateObj=s=>new Date(s+'T12:00:00');const fmt=(n,d=1)=>Number(n).toLocaleString(undefined,{maximumFractionDigits:d});
const dateLabel=s=>dateObj(s).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
const DEMO=new URLSearchParams(location.search).get('demo')==='1';
let KEY=DEMO?'minimal.practice.v1':'minimal.life.v1'; const CATALOG=(window.MINIMAL_FOOD_ROWS||[]).map(r=>({id:'usda-'+r[0],name:r[1],unit:'g',source:'USDA '+(r[2]?'Foundation 2026':'SR Legacy 2018')+' · FDC '+r[0],sourceUrl:'https://fdc.nal.usda.gov/food-details/'+r[0]+'/nutrients',nutrients:Object.fromEntries(['kcal','protein','carbs','fat','fiber','sugar','sodium','calcium','iron','potassium','vitc','vitd','b12','vita','magnesium'].map((k,i)=>[k,r[3][i]])),portions:r[4]}));

const defaults=()=>({version:1,tasks:[],notes:[],events:[],foods:[],library:[],water:[],workouts:[],habits:[],timedActivities:[],checks:{},settings:{name:'',waterGoal:2000,kcalGoal:null,proteinGoal:null,carbsGoal:null,fatGoal:null,showHints:true}});
let state=defaults(),storageOK=true,tab='today',day=dayKey(),month=day.slice(0,7),taskFilter='all',toastTimer;
function practiceState(){
 const s=defaults(),d=dayKey();s.settings.name='Alex';
 s.tasks=[{id:'practice-task',text:'Plan three priorities for today',done:false,date:d,priority:'Normal',steps:[{text:'Choose one focused work block',done:false}]}];
 s.notes=[{id:'practice-note',title:'A note to myself',body:'Small steps count. Leave a little space for the unexpected.',updated:new Date().toISOString()}];
 s.events=[{id:'practice-event',title:'Evening walk',start:d+'T17:30',end:d+'T18:00',category:'Personal',remind:false}];
 s.habits=[{id:'practice-habit',name:'Read for 10 minutes'}];s.water=[{id:'practice-water',date:d,amount:500}];
 const f=CATALOG.find(x=>x.id==='usda-168914');if(f)s.foods=[{...f,id:'practice-food',amount:150,date:d,meal:'Lunch'}];return s;
}
function notify(s){$('#toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',4500)}
function validate(s){
 const dateOK=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&Number.isFinite(new Date(x+'T12:00:00').getTime());
 if(s&&typeof s==='object'){
 for(const key of ['tasks','notes','events','foods','library','water','workouts','habits'])if(Array.isArray(s[key]))for(const x of s[key]){
 if(!x||typeof x.id!=='string'||!/^[-a-zA-Z0-9]+$/.test(x.id))throw Error('Invalid record identifier');
 if(['tasks','foods','water','workouts'].includes(key)&&!dateOK(x.date))throw Error('Invalid record date');
 if(['foods','library'].includes(key)&&(typeof x.source!=='string'||(x.sourceUrl&&!/^https:\/\//.test(x.sourceUrl))))throw Error('Invalid food source');
 if(key==='tasks'&&(!['Normal','High','Low'].includes(x.priority)||!Array.isArray(x.steps)||x.steps.some(t=>!t||typeof t.text!=='string'||typeof t.done!=='boolean')))throw Error('Invalid checklist');
 if(key==='events'&&(typeof x.start!=='string'||typeof x.end!=='string'||x.end<=x.start||typeof x.category!=='string'||typeof x.remind!=='boolean'))throw Error('Invalid event');
 if(key==='notes'&&!Number.isFinite(new Date(x.updated).getTime()))throw Error('Invalid note date');
 if(key==='foods'&&!['Breakfast','Lunch','Dinner','Snack'].includes(x.meal))throw Error('Invalid meal');
 }
 if(s.settings){if(typeof s.settings.name!=='string')throw Error('Invalid display name');for(const key of ['kcalGoal','proteinGoal','carbsGoal','fatGoal'])if(s.settings[key]!=null&&(!Number.isFinite(s.settings[key])||s.settings[key]<0))throw Error('Invalid goal');}
 if(s.checks)for(const [k,v] of Object.entries(s.checks))if(!dateOK(k)||!Array.isArray(v)||v.some(x=>typeof x!=='string'))throw Error('Invalid habit checks');
 }
if(!s||s.version!==1)throw Error('Unrecognized backup version.');for(const k of ['tasks','notes','events','foods','library','water','workouts','habits'])if(!Array.isArray(s[k])||s[k].length>20000)throw Error('Invalid '+k);if(!s.settings||!s.checks||Array.isArray(s.checks))throw Error('Invalid settings');for(const k of ['tasks','notes','events','foods','library','water','workouts','habits'])for(const x of s[k])if(!x||typeof x.id!=='string')throw Error('Invalid record');
 for(const t of s.tasks)if(typeof t.text!=='string'||typeof t.done!=='boolean'||!Array.isArray(t.steps))throw Error('Invalid task');for(const n of s.notes)if(typeof n.title!=='string'||typeof n.body!=='string')throw Error('Invalid note');for(const e of s.events)if(typeof e.title!=='string'||!Number.isFinite(new Date(e.start).getTime())||!Number.isFinite(new Date(e.end).getTime()))throw Error('Invalid event');for(const f of [...s.foods,...s.library]){if(typeof f.name!=='string'||!f.nutrients||!['g','ml'].includes(f.unit))throw Error('Invalid food');for(const [k] of NUTRIENTS)if(f.nutrients[k]!=null&&(!Number.isFinite(f.nutrients[k])||f.nutrients[k]<0))throw Error('Invalid nutrient');}for(const f of s.foods)if(!Number.isFinite(f.amount)||f.amount<=0)throw Error('Invalid portion');for(const w of s.water)if(!Number.isFinite(w.amount)||w.amount<=0)throw Error('Invalid water');for(const w of s.workouts)if(typeof w.name!=='string'||![w.sets,w.reps,w.weight].every(Number.isFinite)||w.sets<1||w.reps<1||w.weight<0)throw Error('Invalid workout');for(const h of s.habits)if(typeof h.name!=='string')throw Error('Invalid habit');if(!Number.isFinite(s.settings.waterGoal)||s.settings.waterGoal<=0)throw Error('Invalid water goal');return s;}
let recordStorage=MinimalDevice.recordStore;
try{if(MinimalDevice.localOnly){const raw=recordStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw));else if(DEMO){state=practiceState();recordStorage.setItem(KEY,JSON.stringify(state));}else{const tasks=JSON.parse(localStorage.getItem('minimal.tasks.v1')||'[]');if(Array.isArray(tasks))state.tasks=tasks.filter(t=>t&&typeof t.text==='string').map(t=>({id:uid(),text:t.text,done:!!t.done,date:day,priority:'Normal',steps:[]}));const note=localStorage.getItem('minimal.quickNote.v1');if(note)state.notes.push({id:uid(),title:'My first notes',body:note,updated:new Date().toISOString()});recordStorage.setItem(KEY,JSON.stringify(state));}}}catch(e){storageOK=false;$('#storage-error').innerHTML='<div class="banner">Your saved data could not be read. Editing is paused to protect it. Export any available data, or open this app where browser storage is enabled.</div>';}
function commit(fn){if(!storageOK){notify('Storage is unavailable; changes were not saved.');return false}const next=JSON.parse(JSON.stringify(state));try{fn(next);validate(next);recordStorage.setItem(KEY,JSON.stringify(next));state=next;$('#save-state').textContent='Saved on this device';return true}catch(e){notify('Not saved: '+e.message);return false}}
function scale(n,amount){return Object.fromEntries(NUTRIENTS.map(([k])=>[k,n[k]==null?null:n[k]*amount/100]))}
function totals(rows){const out={};for(const [k] of NUTRIENTS){let value=0,known=0;for(const f of rows){const n=f.nutrients[k];if(n!=null){value+=n*f.amount/100;known++}}out[k]={value,known,total:rows.length}}return out}
const foods=()=>state.foods.filter(x=>x.date===day),waters=()=>state.water.filter(x=>x.date===day),workouts=()=>state.workouts.filter(x=>x.date===day),tasks=()=>state.tasks.filter(x=>x.date===day),events=()=>state.events.filter(x=>x.start.slice(0,10)===day).sort((a,b)=>a.start.localeCompare(b.start));
const button=(label,action,id='',cls='')=>`<button type="button" class="${cls}" data-action="${action}" data-id="${esc(id)}" ${label==='×'?'aria-label="Delete item"':''}>${label}</button>`;

const card=(title,body,action='',cls='')=>`<section class="card ${cls}"><div class="card-head"><h2>${title}</h2>${action}</div>${body}</section>`;
const progress=(v,g)=>`<div class="progress" role="progressbar" aria-label="Progress toward goal" aria-valuemin="0" aria-valuemax="${g}" aria-valuenow="${Math.min(g,v)}"><div style="width:${Math.min(100,100*v/g)}%"></div></div>`;
function taskRows(rows){return rows.length?rows.map(t=>`<div class="item"><label><input type="checkbox" data-check="task" data-id="${t.id}" ${t.done?'checked':''}><span class="${t.done?'done':''}">${esc(t.text)}<small>${esc(t.category||'Personal')} · ${esc(t.priority)}${t.steps.length?' · '+t.steps.filter(s=>s.done).length+'/'+t.steps.length+' checklist items':''}</small></span></label><div class="actions">${button('Edit','task',t.id,'ghost')}${button('×','remove-task',t.id,'ghost danger')}</div></div>${t.steps.length?`<div class="checklist" style="padding:0 0 14px 32px">${t.steps.map((s,i)=>`<label><input type="checkbox" data-check="step" data-id="${t.id}" data-index="${i}" ${s.done?'checked':''}>${esc(s.text)}</label>`).join('')}</div>`:''}`).join(''):empty('A clear page. Add one thing that matters.');}
function eventRows(rows){return rows.length?rows.map(e=>`<div class="item"><span class="tag">${e.start.slice(11,16)}</span><div class="body"><b>${esc(e.title)}</b><small>${esc(e.category)} · until ${e.end.slice(11,16)}${e.remind?' · reminder':''}</small></div>${button('Edit','event',e.id,'ghost')}${button('×','remove-event',e.id,'ghost danger')}</div>`).join(''):empty('Nothing scheduled. Make room for what matters.');}
function waterCard(){const amount=waters().reduce((s,x)=>s+x.amount,0);return card('A moment to hydrate',`<div class="water-num">${fmt(amount,0)} <small>/ ${fmt(state.settings.waterGoal,0)} ml</small></div>${progress(amount,state.settings.waterGoal)}<div class="row">${button('+ 250 ml','water','250')}${button('+ 500 ml','water','500')}${button('Undo last','undo-water','','ghost')}</div><p class="footnote" style="margin:14px 0 0">Your adjustable goal, not a medical recommendation.</p>`,'','tint')}
function habitsCard(){return card('Little things, daily',state.habits.length?state.habits.map(h=>`<div class="item"><label><input type="checkbox" data-check="habit" data-id="${h.id}" ${state.checks[day]?.includes(h.id)?'checked':''}>${esc(h.name)}</label>${button('×','remove-habit',h.id,'ghost')}</div>`).join(''):empty('Read. Walk. Stretch. Start with one small habit.'),button('+ Add','habit','','ghost'))}
function dailyStats(){const t=totals(foods()),completed=tasks().filter(t=>t.done).length;return `<div class="stats"><div class="stat"><small>Priorities</small><strong>${completed}<small> / ${tasks().length}</small></strong><small>one step at a time</small></div><div class="stat"><small>Food energy</small><strong>${t.kcal.known?fmt(t.kcal.value,0):'—'}<small> kcal</small></strong><small>${t.kcal.known<t.kcal.total?'partial data':'logged today'}</small></div><div class="stat"><small>Water</small><strong>${fmt(waters().reduce((s,x)=>s+x.amount,0)/1000,2)}<small> L</small></strong><small>keep a glass nearby</small></div><div class="stat"><small>Training</small><strong>${workouts().reduce((s,x)=>s+x.sets,0)}<small> sets</small></strong><small>${workouts().length} exercise entries</small></div></div>`}
function todayView(){return header(`Make space for<br>your kind of day${state.settings.name?', '+esc(state.settings.name):''}.`,'A clear mind. A little movement. One good thing at a time.','<div class="leaf" aria-hidden="true"></div>')+dailyStats()+`<div class="grid"><div>${card('Your priorities',taskRows(tasks().slice(0,5)),button('+ Add task','task','','ghost'))}${card('On the horizon',eventRows(events()),button('+ Plan','event','','ghost'))}</div><div>${waterCard()}${habitsCard()}</div></div>`+card('A thought worth keeping',state.notes.length?`<p class="note-preview">${esc(state.notes[0].body)}</p>`:empty('Give the thoughts in your head a place to land.'),button('Open notes','nav','notes','ghost'))}
function tasksView(){let rows=tasks().filter(t=>taskFilter==='all'||(taskFilter==='done'?t.done:!t.done));return header('Less noise.<br>More intention.','Break big plans into small, doable steps.',button('+ Quick add task','task','','primary'))+card('Your checklist',`<div class="row" style="margin-bottom:14px">${['all','open','done'].map(x=>button(x[0].toUpperCase()+x.slice(1),'filter',x,taskFilter===x?'primary':'')).join('')}</div>${taskRows(rows)}`)}
function calendarMonthView(){const base=dateObj(month+'-01'),start=new Date(base);start.setDate(1-(base.getDay()+6)%7);let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=dayKey(d),count=state.events.filter(e=>e.start.startsWith(k)).length;cells+=`<button class="${k===day?'selected':''} ${k.slice(0,7)!==month?'outside':''}" data-action="date" data-id="${k}" aria-label="${esc(dateLabel(k))}, ${count} events"><span>${d.getDate()}</span><span>${count?'<i class="dot"></i>'.repeat(Math.min(count,3)):''}</span></button>`}return `<div class="month-head">${button('‹','month','-1','ghost')}<h2 style="margin:0">${base.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2>${button('›','month','1','ghost')}</div><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>'<span class="weekday">'+x+'</span>').join('')}${cells}</div>`;}
function calendarView(){return header('Give your day<br>a little shape.','Plan focus time, movement, and everything in between.',button('+ Quick add event','event','','primary'))+`<div class="grid"><div class="card">${calendarMonthView()}</div><div>${card(dateLabel(day),eventRows(events()))}<p class="footnote">In-app reminders appear while Minimal is open. Browser or email notifications while closed are not connected.</p></div></div>`;}
function notesView(){return header('A quieter mind<br>starts here.','Ideas, plans, daily reflections. Keep what matters.',button('+ Quick add note','note','','primary'))+`<input type="search" id="note-search" placeholder="Search your notes…" aria-label="Search notes" style="margin-bottom:20px"><div class="note-grid" id="note-list">${noteCards(state.notes)}</div>`}
function noteCards(rows){return rows.length?rows.map(n=>card(esc(n.title),`<p class="note-preview">${esc(n.body)}</p><small>Updated ${new Date(n.updated).toLocaleDateString()}</small>`,`<div class="actions">${button('Edit','note',n.id,'ghost')}${button('×','remove-note',n.id,'ghost danger')}</div>`)).join(''):empty('No notes yet. Start with a thought.')}
function nutrientCards(){const t=totals(foods());return '<div class="nutrients">'+NUTRIENTS.map(([k,name,unit],index)=>`<div class="nutrient ${index>=4?'extra-nutrient':''}"><small>${name}</small><b>${t[k].known?fmt(t[k].value,k==='kcal'?0:2):'—'} <small>${unit}</small></b><small>${t[k].total?`${t[k].known}/${t[k].total} foods have data`:'No food logged'}${t[k].known<t[k].total?' · partial':''}</small>${state.settings[k+'Goal']>0?progress(t[k].value,state.settings[k+'Goal'])+'<small>Target '+fmt(state.settings[k+'Goal'])+' '+unit+'</small>':''}</div>`).join('')+'</div>'}
function nutritionView(){const rows=foods(),t=totals(rows);return header('Nourish your day.','Know your portions. Understand your nutrition.',button('+ Quick add food','quick-add','','primary'))+`<div class="row" style="margin-bottom:20px">${button('Search food','food')}${button('Food library & recipes','library')}${button('Nutrition goals','goals','','ghost')}${plannerButton('Indian kitchen','kitchen')}</div>`+card('Your daily nutrition','<button type="button" id="toggle-nutrients" aria-expanded="false">Show vitamins & minerals</button>'+nutrientCards()+`<p class="footnote" style="margin-top:18px">Totals sum only known values; incomplete totals are not your full intake. Values are estimates from food records or your labels. Match raw/cooked preparation and weigh the edible portion.</p>`)+card('Meals',rows.length?['Breakfast','Lunch','Dinner','Snack'].map(meal=>{const group=rows.filter(f=>f.meal===meal);if(!group.length)return '';return `<h3 style="margin:20px 0 0">${meal}</h3>`+group.map(f=>`<div class="item"><div class="body"><b>${esc(f.name)}</b><small>${f.quick?'1 entry':fmt(f.amount)+' '+f.unit} · ${f.nutrients.kcal==null?'Unknown calories':fmt(f.nutrients.kcal*f.amount/100,0)+' kcal'} · ${esc(f.source)}</small></div>${button(f.quick?'Edit':'Portion','portion',f.id,'ghost')}${button('×','remove-food',f.id,'ghost danger')}</div>`).join('')}).join(''):empty('Search for a food, choose your portion, and let Minimal do the maths.'))+waterCard()}
function workoutView(){const rows=workouts();return header('Show up.<br>Get a little stronger.','Log what you did. Build on it next time.',button('+ Log exercise','workout','','primary'))+card('Training log',rows.length?rows.map(w=>`<div class="item"><div class="body"><b>${esc(w.name)}</b><small>${w.sets} sets × ${w.reps} reps × ${fmt(w.weight)} kg${w.notes?' · '+esc(w.notes):''}</small></div>${button('Edit','workout',w.id,'ghost')}${button('×','remove-workout',w.id,'ghost danger')}</div>`).join(''):empty('Your next session starts with one exercise.'))+card('This week',`<p class="muted">Sets logged each day. Volume counts only the external weight you enter.</p><div class="week-bars">${Array.from({length:7},(_,i)=>{const d=dateObj(day);d.setDate(d.getDate()-6+i);const k=dayKey(d),n=state.workouts.filter(w=>w.date===k).reduce((s,w)=>s+w.sets,0);return `<div><div class="bar" style="height:${Math.min(65,n*4)}px" title="${n} sets"></div>${d.toLocaleDateString(undefined,{weekday:'short'})}<br>${n}</div>`}).join('')}</div><p class="footnote" style="margin-top:24px">Selected day volume: ${fmt(rows.reduce((s,w)=>s+w.sets*w.reps*w.weight,0),0)} kg · Bodyweight exercises may use 0 kg added weight.</p>`)}
function settingsView(){return header('Make it yours.','A simple setup. Your data, under your control.')+`<div class="grid"><div>${card('Preferences',`<p class="muted">Set your display name and personal targets.</p><div class="row" style="margin-bottom:14px">${button(state.settings.showHints===false?'Show hints':'Hide hints','toggle-hints')}${button('Guided tour','tour')}${button('Open practice demo','practice')}</div>${button('Edit preferences','preferences','','primary')}`)}${card('Backup & restore',`<p class="muted">The hosted app saves to your account automatically. The browser uses a temporary tab copy by default. Remember this device is optional. Export is optional for safekeeping or moving data between website addresses.</p><div class="row">${button('Export backup','export','','primary')}<button type="button" data-cloud="clear-device">Clear this device copy</button><label class="field">Restore a JSON backup<input type="file" accept="application/json,.json" id="import-file" class="file-input"></label></div><p class="footnote" style="margin-top:15px">Import replaces current data after confirmation. Keep your exported backup private.</p>`)}</div><div>${card('What this version does',`<p class="footnote">Tasks and checklists · calendar events · in-app reminders · notes · habits · hydration · food calculations · exercise logs.</p><p class="footnote">Account sync is available on the hosted app. Closed-app reminders, wearable integrations, AI meal-photo estimates, and coaching are not connected.</p><p class="footnote">Food library: USDA FoodData Central, public-domain SR Legacy (2018) and Foundation (2026) records. Packaged-food barcode lookup: Open Food Facts, ODbL. Verify packaged-food data against your label.</p><p><a href="https://fdc.nal.usda.gov/" target="_blank" rel="noopener">USDA data</a> · <a href="https://world.openfoodfacts.org/" target="_blank" rel="noopener">Open Food Facts</a></p>`)}${card('Stored here',`<p class="muted">${state.tasks.length} tasks · ${state.notes.length} notes · ${state.foods.length} meal entries</p><p class="footnote">Health records are not uploaded to GitHub. Barcode requests send the barcode to Open Food Facts. The hosted app saves automatically. An export is optional for safekeeping.</p>`)}</div></div>`}
const tabs=[['today','◌','Today'],['organizer','▤','Planner'],['plans','◇','Plans'],['tasks','✓','Tasks'],['calendar','▦','Calendar'],['nutrition','◒','Nutrition'],['workouts','↗','Training'],['rewards','✦','Rewards'],['focus','◴','Focus'],['notes','≡','Notes'],['settings','⚙','Settings']];
function render(){document.title=tabs.find(x=>x[0]===tab)[2]+' — Minimal';$('#day').value=day;$('#nav').innerHTML=tabs.map(([k,i,n])=>`<button data-action="nav" data-id="${k}" class="${tab===k?'active':''}" ${tab===k?'aria-current="page"':''}><span aria-hidden="true">${i}</span>${n}</button>`).join('');$('#mode-banner').innerHTML=DEMO?`<div class="practice-banner"><p><b>Practice demo</b><br>Sample data in a separate space. Your real logs are untouched.</p><div class="row">${button('Reset demo','reset-practice')}${button('Return to my app','exit-practice')}</div></div>`:'';$('#view').innerHTML=({today:todayView,organizer:organizerView,plans:plannerView,focus:focusView,tasks:tasksView,calendar:calendarView,nutrition:nutritionView,workouts:trainingView,rewards:rewardsView,notes:notesView,settings:settingsView})[tab]();
 const tips={organizer:'Tasks follow the selected day. Notes show your latest ideas across all days. Tap a date in Calendar to update the day, or use the three shortcuts to jump to a section.',plans:'Set your preferences to see meal and movement ideas. Suggestions use your logs and can be switched off at any time.',focus:'Choose a rhythm, name your task, and begin. Confirm completion to record a focus block; breaks do not earn study credit.',today:'The date at the top controls the dashboard. Open Food to log a meal; the +250 ml button records one glass of water.',tasks:'Choose a day, add a task, and put checklist steps on separate lines. Checking a subtask does not automatically complete its parent.',calendar:'Click a date to see its events. Use + New event to choose start and end times. Reminders appear only while Minimal is open.',nutrition:'Tap Quick add food, search what you ate, and choose a match. A standard serving shows calories and macros automatically. Adjust the portion, then tap Log food. Homemade dish values are estimates.',workouts:'Start a session, add exercises, enter weight and reps for each set, and tick completed sets. Finish the session to record it. Rest days are part of progress.',notes:'Unfinished note drafts save with your records. Press Save to add the note to your collection. Search finds titles and note text.',settings:'Export a backup before changing devices or website addresses. Restore replaces your current records after you confirm.'};
 const nutrientToggle=$('#toggle-nutrients');if(nutrientToggle)nutrientToggle.onclick=()=>{const show=nutrientToggle.getAttribute('aria-expanded')!=='true';nutrientToggle.setAttribute('aria-expanded',String(show));nutrientToggle.textContent=show?'Hide extra nutrients':'Show vitamins & minerals';$('#view .nutrients').classList.toggle('expanded',show)};const intro=$('#view .intro');if(intro)intro.insertAdjacentHTML('afterend',hint(tips[tab]||'Complete tasks, learning, habits, or movement to build your streak. Challenges use the current month.'));
 if(tab==='today'&&state.settings.showHints!==false)intro.insertAdjacentHTML('afterend',`<div class="welcome"><div><b>First time here? Start small.</b><p>Take a short tour, or explore with sample data.</p></div><div class="row">${button('Start tour','tour')}${button('Practice demo','practice','','ghost')}${button('Hide hints','toggle-hints','','ghost')}</div></div>`);
} 
function dialog(title,body){$('#dialog-content').innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="ghost" data-action="close" aria-label="Close dialog">×</button></div>${body}`;$('#modal').setAttribute('aria-labelledby','dialog-title');if(!$('#modal').open)$('#modal').showModal()}
function close(){ $('#modal').close();$('#dialog-content').innerHTML=''; }
$('#modal').addEventListener('cancel',e=>{e.preventDefault();close()});
$('#modal').addEventListener('close',()=>{if(!$('#modal').open)$('#dialog-content').innerHTML=''});
function field(name,label,type='text',value='',extra=''){const fieldHints={steps:'One checklist item per line. Existing completed items keep their checkmark when their text is unchanged.',amount:'Enter the amount you actually ate. Use the displayed unit; grams and millilitres are not interchangeable.',basis:'For a label printed per 30 g, enter 30 here and copy its printed nutrient values below.',weight:'Added weight only. Enter 0 for a bodyweight exercise with no added load.',sets:'Number of sets with the same weight and repetitions.',reps:'Repetitions in each set, not all sets combined.',start:'Uses the local timezone of this device.',end:'Must be later than the start time.',waterGoal:'Your own daily target. This app does not prescribe a medical target.'};const help=state.settings.showHints!==false&&fieldHints[name]?`<small>${fieldHints[name]}</small>`:'';return `<label class="field ${type==='textarea'?'wide':''}">${label}${type==='textarea'?`<textarea name="${name}" rows="5" ${extra}>${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${extra}>`}${help}</label>`}
function select(name,label,values,value){return `<label class="field">${label}<select name="${name}">${values.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}
function formDialog(title,fields,onSave){dialog(title,`<form id="editor"><div class="fields">${fields}</div><p class="form-error" id="form-error" role="alert"></p><div class="dialog-footer">${button('Cancel','close')}<button class="primary" type="submit">Save</button></div></form>`);$('#editor').onsubmit=e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.target));const result=onSave(d);if(result!==false){close();render();notify('Saved');if(typeof result==='function')result()}}catch(err){$('#form-error').textContent=err.message}};}
const titleText=s=>{s=String(s||'').trim();if(!s)throw Error('Please enter a name.');return s};
const number=(s,min=0,max=1e7)=>{const n=Number(s);if(s===''||!Number.isFinite(n)||n<min||n>max)throw Error(`Enter a number between ${min} and ${max}.`);return n};
function upsert(collection,item){const saved=commit(s=>{const i=s[collection].findIndex(x=>x.id===item.id);if(i<0)s[collection].unshift(item);else s[collection][i]=item});if(saved&&collection==='foods'){day=item.date;tab='nutrition'}return saved}
function taskEditor(id){const t=state.tasks.find(x=>x.id===id)||{id:uid(),text:'',date:day,priority:'Normal',done:false,steps:[]};formDialog(id?'Edit task':'A new priority',field('text','Task','text',t.text,'required maxlength="160"')+field('date','Day','date',t.date,'required')+select('priority','Priority',['Normal','High','Low'],t.priority)+select('category','Category',['Personal','Academic','Work','Physical'],t.category||'Personal')+field('steps','Checklist — one item per line','textarea',t.steps.map(s=>s.text).join('\n'),'maxlength="5000"'),d=>upsert('tasks',{...t,text:titleText(d.text),date:d.date,priority:d.priority,category:d.category,steps:d.steps.split('\n').map(x=>x.trim()).filter(Boolean).map(text=>({text,done:t.steps.find(s=>s.text===text)?.done||false}))}))}
function eventEditor(id){const e=state.events.find(x=>x.id===id)||{id:uid(),title:'',start:day+'T09:00',end:day+'T10:00',category:'Personal',remind:false};formDialog('Plan your time',field('title','Event','text',e.title,'required maxlength="160"')+select('category','Category',['Personal','Work','Workout','Meal','Rest'],e.category)+field('start','Starts','datetime-local',e.start,'required')+field('end','Ends','datetime-local',e.end,'required')+select('remind','In-app reminder at start',['Off','On'],e.remind?'On':'Off'),d=>{if(d.end<=d.start)throw Error('End time must be after start time.');return upsert('events',{...e,...d,title:titleText(d.title),remind:d.remind==='On'})})}
function noteEditor(id){const n=state.notes.find(x=>x.id===id)||{id:uid(),title:'',body:''};formDialog('A thought worth keeping',field('title','Title','text',n.title,'required maxlength="160"')+field('body','Your note','textarea',n.body,'maxlength="50000"'),d=>upsert('notes',{...n,title:titleText(d.title),body:d.body,updated:new Date().toISOString()}))}
function workoutEditor(id){const w=state.workouts.find(x=>x.id===id)||{id:uid(),date:day,name:'',sets:3,reps:10,weight:0,notes:''};formDialog('Log your movement',field('name','Exercise','text',w.name,'required maxlength="160"')+field('date','Day','date',w.date,'required')+field('sets','Sets','number',w.sets,'required min="1" max="100" step="1"')+field('reps','Reps per set','number',w.reps,'required min="1" max="1000" step="1"')+field('weight','Added weight (kg)','number',w.weight,'required min="0" max="2000" step="0.1"')+field('notes','Notes','text',w.notes,'maxlength="500"'),d=>upsert('workouts',{...w,...d,name:titleText(d.name),sets:number(d.sets,1,100),reps:number(d.reps,1,1000),weight:number(d.weight,0,2000)}))}
function preferences(){formDialog('Your preferences',field('name','Display name','text',state.settings.name,'maxlength="40"')+field('waterGoal','Daily water goal (ml)','number',state.settings.waterGoal,'required min="250" max="10000" step="50"'),d=>commit(s=>{s.settings.name=d.name.trim();s.settings.waterGoal=number(d.waterGoal,250,10000)}))}
function goals(){formDialog('Your personal nutrition targets',`<p class="footnote field wide">Optional targets you choose yourself. These are not calculated dietary recommendations. Leave blank to unset.</p>`+[['kcalGoal','Energy (kcal)'],['proteinGoal','Protein (g)'],['carbsGoal','Carbohydrates (g)'],['fatGoal','Fat (g)']].map(([k,n])=>field(k,n,'number',state.settings[k]??'','min="0" max="10000" step="any"')).join(''),d=>commit(s=>{for(const k in d)s.settings[k]=d[k]===''?null:number(d[k],0,10000)}))}
function foodPicker(){dialog('Find your food',`<p class="footnote">Search ${CATALOG.length} USDA reference foods and your saved foods. Choose the exact preparation. For packaged products, use a barcode.</p><input type="search" id="food-search" aria-label="Search foods" placeholder="Try rice, lentils, egg, banana…"><div class="row" style="margin-top:12px">${button('Enter barcode','barcode')}${button('Add from label','custom-food')}</div><div class="search-results" id="food-results"></div>`);const show=q=>{$('#food-results').innerHTML=[...state.library,...CATALOG].filter(f=>q.toLowerCase().split(/\s+/).every(w=>f.name.toLowerCase().includes(w))).slice(0,35).map(f=>`<button data-action="select-food" data-id="${esc(f.id)}"><b>${esc(f.name)}</b><small>${esc(f.source)} · ${f.nutrients.kcal??'Unknown'} kcal / 100 ${f.unit}</small></button>`).join('')||empty('No exact match. Add values from your label or build a recipe.');};$('#food-search').oninput=e=>show(e.target.value);show('');}
function portion(food,entry){if(food.quick){quickTotals(entry||food);return;}formDialog(entry?'Edit portion':'Log '+esc(food.name),`<p class="footnote field wide">${esc(food.source)} · Values per 100 ${food.unit}. ${food.sourceUrl?`<a href="${esc(food.sourceUrl)}" target="_blank" rel="noopener">Source record</a>`:''}</p>`+(food.portions?.length?`<label class="field wide">Optional reference portion<select id="portion-choice"><option value="">Enter weight yourself</option>${food.portions.map(p=>`<option value="${esc(p[1])}">${esc(p[0])} — ${fmt(p[1])} g</option>`).join('')}</select></label>`:'')+field('amount',`Amount eaten (${food.unit})`,'number',entry?.amount||100,'required min="0.1" max="10000" step="any"')+select('meal','Meal',['Breakfast','Lunch','Dinner','Snack'],entry?.meal||'Breakfast')+field('date','Day','date',entry?.date||day,'required')+`<div class="calculation field wide" id="portion-preview"></div>`,d=>upsert('foods',{...food,id:entry?.id||uid(),amount:number(d.amount,.1,10000),meal:d.meal,date:d.date}));const preview=()=>{const a=Number($('#editor [name=amount]').value),n=scale(food.nutrients,a);$('#portion-preview').innerHTML=`<b>${Number.isFinite(a)?fmt(a):0} ${food.unit} ÷ 100 × reference values</b><br>`+NUTRIENTS.slice(0,4).map(([k,label,unit])=>`${label}: ${n[k]==null?'unknown':fmt(n[k],2)+' '+unit}`).join(' · ');};$('#editor [name=amount]').oninput=preview;if($('#portion-choice'))$('#portion-choice').onchange=e=>{if(e.target.value){$('#editor [name=amount]').value=e.target.value;preview()}};preview()}
function customFood(){formDialog('Create a food from its label',field('name','Food name','text','','required maxlength="200"')+select('unit','Label basis unit',['g','ml'],'g')+field('basis','Label values are for this amount','number',100,'required min="0.1" max="10000" step="any"')+`<p class="footnote field wide">Enter values exactly as printed for that amount. Blank means unknown; enter 0 only when the label states zero. Energy uses kcal, not kJ.</p>`+NUTRIENTS.map(([k,n,u])=>field(k,n+' ('+u+')','number','','min="0" max="1000000" step="any"')).join(''),d=>{const basis=number(d.basis,.1,10000),nutrients={};for(const [k] of NUTRIENTS)nutrients[k]=d[k]===''?null:number(d[k],0,1e6)*100/basis;if(NUTRIENTS.every(([k])=>nutrients[k]==null))throw Error('Enter at least one nutrient value.');const food={id:uid(),name:titleText(d.name),unit:d.unit,nutrients,source:'Your label · values entered by you',sourceUrl:''};return upsert('library',food)?()=>portion(food):false})}
let barcodeLast=0;
async function barcode(){dialog('Find a packaged food',`<p class="footnote">Enter the barcode digits. Open Food Facts contains community-contributed data; compare with your package before logging. No camera access needed.</p><form id="barcode-form" class="row"><input name="code" inputmode="numeric" pattern="[0-9]{8,14}" required placeholder="8–14 barcode digits" aria-label="Barcode"><button class="primary">Look up</button></form><div id="barcode-result" class="footnote" role="status" style="margin-top:16px"></div>`);$('#barcode-form').onsubmit=async e=>{e.preventDefault();const out=$('#barcode-result');if(Date.now()-barcodeLast<5000){out.textContent='Please wait a few seconds before another lookup.';return}barcodeLast=Date.now();const code=new FormData(e.target).get('code');out.textContent='Looking up barcode…';const b=e.target.querySelector('button');b.disabled=true;try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=code,product_name,brands,nutriments,nutrition_data_per,serving_size',{signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('Food service unavailable. Try again later or enter the label.');const j=await r.json();if(j.status!==1)throw Error('Barcode not found. You can enter values from the label.');const p=j.product,n=p.nutriments||{},map={kcal:['energy-kcal',1],protein:['proteins',1],carbs:['carbohydrates',1],fat:['fat',1],fiber:['fiber',1],sugar:['sugars',1],sodium:['sodium',1000],calcium:['calcium',1000],iron:['iron',1000],potassium:['potassium',1000],vitc:['vitamin-c',1000],vitd:['vitamin-d',1e6],b12:['vitamin-b12',1e6],magnesium:['magnesium',1000]};const nutrients={};for(const [k] of NUTRIENTS){const [key,m]=map[k]||['',1],v=n[key+'_100g'];nutrients[k]=typeof v==='number'&&Number.isFinite(v)&&v>=0?v*m:null;}if(nutrients.kcal==null&&typeof n['energy-kj_100g']==='number')nutrients.kcal=n['energy-kj_100g']/4.184;if(NUTRIENTS.every(([k])=>nutrients[k]==null))throw Error('This record has no usable nutrition values. Enter the label instead.');const f={id:'off-'+code,name:p.product_name||'Barcode '+code,source:'Open Food Facts · verify label',sourceUrl:'https://world.openfoodfacts.org/product/'+code,unit:'g',nutrients};if(!out.isConnected)return;out.innerHTML=`<b>${esc(f.name)}</b><p>Confirm whether the reference values are per 100 g or 100 ml on your package. The database field name does not distinguish these reliably.</p><label class="field">Reference unit<select id="off-unit"><option>g</option><option>ml</option></select></label><p>${NUTRIENTS.slice(0,4).map(([k,label,u])=>label+': '+(nutrients[k]==null?'unknown':fmt(nutrients[k])+' '+u)).join(' · ')}</p><button id="use-barcode" class="primary">Use this food</button>`;$('#use-barcode').onclick=()=>{f.unit=$('#off-unit').value;if(upsert('library',f))portion(f)};}catch(err){if(out.isConnected)out.textContent=err.message}finally{if(b.isConnected)b.disabled=false}}}
function library(){dialog('Your food library',`<p class="footnote">Saved labels, barcode products, and recipes.</p><div class="row">${button('+ Label food','custom-food')}${button('+ Build recipe','recipe')}</div><div class="search-results">${state.library.map(f=>`<div class="item"><div class="body"><b>${esc(f.name)}</b><small>${esc(f.source)}</small></div>${button('Log','select-food',f.id,'ghost')}${button('×','remove-library',f.id,'ghost danger')}</div>`).join('')||empty('Your saved foods will appear here.')}</div>`)}
function recipe(seed){let ingredients=(seed?.ingredients||[]).map(x=>({...x}));dialog('Build a recipe',`<p class="footnote">Add weighed ingredients, then enter the final edible cooked weight. Nutrients are summed and divided by that final weight. Cooking losses and discarded liquid are not modeled.</p><form id="recipe-form" class="stack"><label class="field">Recipe name<input name="name" required maxlength="200" value="${esc(seed?.name||'')}"></label><div class="split"><div><label class="field">Find an ingredient<input type="search" id="ingredient-search" placeholder="Search rice, lentils, egg…"></label><label class="field">Ingredient<select id="ingredient"><option value="">Search and choose a food</option></select></label><small id="ingredient-count">Search by name, then select the exact preparation.</small></div><label class="field">Ingredient grams<input id="ingredient-grams" type="number" min="0.1" step="any" value="100"></label></div><button type="button" id="add-ingredient">Add ingredient</button><div id="ingredient-list"></div><label class="field">Final edible recipe weight (g)<input name="yield" type="number" min="0.1" max="100000" step="any" required value=""></label><p class="form-error" id="recipe-error" role="alert"></p><button class="primary">Save recipe</button></form>`);$('#ingredient-search').oninput=e=>{const q=e.target.value.trim().toLowerCase(),matches=q?[...state.library,...CATALOG].filter(f=>f.unit==='g'&&foodMatches(f,q)):[];$('#ingredient').innerHTML='<option value="">Choose a matching food</option>'+matches.slice(0,40).map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('');$('#ingredient-count').textContent=matches.length?`${matches.length} matches · showing up to 40; narrow your search if needed.`:'No match yet. Try a food name or save a label food first.'};const show=()=>{$('#ingredient-list').innerHTML=ingredients.map((f,i)=>`<div class="item"><div class="body">${esc(f.name)}</div><label class="recipe-amount"><input type="number" min="0.1" max="100000" step="any" value="${esc(f.amount)}" data-recipe-amount="${i}" aria-label="${esc(f.name)} grams" required><span>g</span></label><button type="button" data-recipe-remove="${i}" aria-label="Remove ingredient">×</button></div>`).join('')};$('#add-ingredient').onclick=()=>{try{const f=[...CATALOG,...state.library].find(f=>f.id===$('#ingredient').value);if(!f)throw Error('Choose an ingredient');ingredients.push({id:f.id,name:f.name,unit:f.unit,source:f.source,sourceUrl:f.sourceUrl||'',nutrients:{...f.nutrients},amount:number($('#ingredient-grams').value,.1,100000)});show();$('#recipe-error').textContent=''}catch(e){$('#recipe-error').textContent=e.message}};$('#ingredient-list').onchange=e=>{if(e.target.dataset.recipeAmount!==undefined){try{ingredients[Number(e.target.dataset.recipeAmount)].amount=number(e.target.value,.1,100000);$('#recipe-error').textContent=''}catch(err){$('#recipe-error').textContent=err.message}}};$('#ingredient-list').onclick=e=>{const b=e.target.closest('[data-recipe-remove]');if(b){ingredients.splice(Number(b.dataset.recipeRemove),1);show()}};$('#recipe-form').onsubmit=e=>{e.preventDefault();try{if(!ingredients.length)throw Error('Add at least one ingredient.');const d=new FormData(e.target),yieldG=number(d.get('yield'),.1,100000),t=totals(ingredients),nutrients={};for(const [k] of NUTRIENTS)nutrients[k]=t[k].known===t[k].total?t[k].value*100/yieldG:null;const f={id:uid(),name:titleText(d.get('name')),unit:'g',source:'Your recipe · calculated from ingredients',sourceUrl:'',nutrients,ingredients,yieldG};if(upsert('library',f)){close();render();notify('Recipe saved to your food library');if(seed?.logAfter){portion(f);if($('#editor [name=date]'))$('#editor [name=date]').value=seed.date||day;if($('#editor [name=meal]'))$('#editor [name=meal]').value=seed.meal||defaultMeal()}}}catch(err){$('#recipe-error').textContent=err.message}};show();if(seed){$('#recipe-form').insertAdjacentHTML('afterbegin','<p class="regional-note">Editable starting recipe. Check every ingredient and amount, add missing spices or salt, and enter the measured final weight of your cooked batch. Cooking losses and oil absorption are not modelled.</p>')}}

function defaultMeal(){const h=new Date().getHours();return h<11?'Breakfast':h<16?'Lunch':h<21?'Dinner':'Snack'}

 const seen=new Set(),recent=state.foods.filter(f=>{const key=JSON.stringify([f.name,f.amount,f.unit,f.nutrients]);if(seen.has(key))return false;seen.add(key);return true}).slice(0,5);
 dialog('Quick Add',`<p class="muted">What are you eating?</p><div class="split"><label class="field">Log for<input id="quick-date" type="date" value="${day}" required></label><label class="field">Meal<select id="quick-meal">${['Breakfast','Lunch','Dinner','Snack'].map(x=>`<option ${x===defaultMeal()?'selected':''}>${x}</option>`).join('')}</select></label></div>${hint('Search by name below, or repeat a recent food with the same portion. You can change its portion later in Nutrition.')}<input type="search" id="quick-search" aria-label="Search food for Quick Add" placeholder="Search banana, rice, oats…"><div class="quick-toolbar">${button('Enter calories / macros','quick-totals')}${button('Use a barcode','barcode')}${button('Read a label','custom-food')}</div><div id="quick-results" class="search-results"></div><div id="quick-recent"><h3 style="margin:20px 0 4px">Recent foods</h3>${recent.length?recent.map(f=>`<div class="recent-row"><div><b>${esc(f.name)}</b><small>${f.quick?'Same totals':fmt(f.amount)+' '+f.unit} · ${f.nutrients.kcal==null?'Calories unknown':fmt(f.nutrients.kcal*f.amount/100,0)+' kcal'}</small></div>${button('Add again','quick-repeat',f.id)}</div>`).join(''):empty('Your logged foods appear here for faster repeat meals.')}</div><p class="footnote">Food names alone do not tell us the portion or exact nutrients. Choose a database match or enter values you know.</p>`);
 $('#quick-search').oninput=e=>{const q=e.target.value.trim().toLowerCase();$('#quick-recent').hidden=!!q;$('#quick-results').innerHTML=q?[...state.library,...CATALOG].filter(f=>q.split(/\s+/).every(w=>f.name.toLowerCase().includes(w))).slice(0,20).map(f=>`<button data-action="quick-pick" data-id="${esc(f.id)}"><b>${esc(f.name)}</b><small>${esc(f.source)} · ${f.nutrients.kcal??'Unknown'} kcal / 100 ${f.unit}</small></button>`).join('')||empty('No match. Try another name, enter a barcode, or enter known totals.'):'';};

}

function quickTotals(entry){const date=entry?.date||$('#quick-date')?.value||day,meal=entry?.meal||$('#quick-meal')?.value||defaultMeal();
 formDialog(entry?'Edit quick entry':'Quick Add · known totals',field('name','What did you eat?','text',entry?.name||'','placeholder="e.g. Protein bar" maxlength="200"')+select('meal','Meal',['Breakfast','Lunch','Dinner','Snack'],meal)+field('date','Day','date',date,'required')+`<p class="footnote field wide">Enter totals for everything you ate in this entry—not values per 100 g. You can enter calories only. Leave unknown values blank; blank is not zero. We do not estimate calories from the food name.</p>`+NUTRIENTS.slice(0,4).map(([k,n,u])=>field(k,n+' ('+u+')','number',entry?.nutrients[k]??'','min="0" max="100000" step="any"')).join(''),d=>{if(NUTRIENTS.slice(0,4).every(([k])=>d[k]===''))throw Error('Enter calories or at least one macro.');const nutrients=Object.fromEntries(NUTRIENTS.map(([k])=>[k,null]));for(const [k] of NUTRIENTS.slice(0,4))nutrients[k]=d[k]===''?null:number(d[k],0,100000);return upsert('foods',{id:entry?.id||uid(),name:d.name.trim()||'Quick entry',quick:true,amount:100,unit:'g',date:d.date,meal:d.meal,nutrients,source:'Quick Add · totals entered by you',sourceUrl:''})});
 $('#editor button[type="submit"]').textContent=entry?'Save changes':'Log food';
}

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;try{if(a==='close'){close();return}if(a==='nav'){tab=id;render();return}if(a==='quick-add')quickAdd();else if(a==='quick-totals')quickTotals();else if(a==='quick-repeat')repeatFood(id);else if(a==='tour')startTour();else if(a==='tour-next')showTour(tourIndex+1);else if(a==='tour-back')showTour(tourIndex-1);else if(a==='tour-try'){close();render();}else if(a==='toggle-hints'){if(commit(s=>s.settings.showHints=s.settings.showHints===false)){render();notify(state.settings.showHints?'Hints are on':'Hints hidden. Restore them in Settings.')}}else if(a==='practice'){location.search='?demo=1'}else if(a==='exit-practice'){location.search=''}else if(a==='reset-practice'){if(DEMO&&commit(s=>Object.assign(s,practiceState()))){render();notify('Practice data reset')}}else if(a==='task')taskEditor(id);else if(a==='event')eventEditor(id);else if(a==='note')noteEditor(id);else if(a==='workout')workoutEditor(id);else if(a==='food')foodPicker();else if(a==='select-food'){const f=[...state.library,...CATALOG].find(x=>x.id===id);if(f)portion(f)}else if(a==='portion'){const f=state.foods.find(x=>x.id===id);portion(f,f)}else if(a==='custom-food')customFood();else if(a==='library')library();else if(a==='recipe')recipe();else if(a==='barcode')barcode();else if(a==='goals')goals();else if(a==='preferences')preferences();else if(a==='export')exportBackup();else if(a==='water'){if(commit(s=>s.water.push({id:uid(),date:day,amount:Number(id)}))){render();notify(id+' ml logged')}}else if(a==='undo-water'){const last=waters().at(-1);if(last&&commit(s=>s.water=s.water.filter(x=>x.id!==last.id)))render()}else if(a==='habit')formDialog('A small daily habit',field('name','Habit','text','','required maxlength="100"'),d=>upsert('habits',{id:uid(),name:titleText(d.name)}));else if(a==='date'){day=id;render()}else if(a==='month'){const d=dateObj(month+'-01');d.setMonth(d.getMonth()+Number(id));month=dayKey(d).slice(0,7);render()}else if(a==='filter'){taskFilter=id;render()}else if(a.startsWith('remove-')){const collection={task:'tasks',event:'events',note:'notes',food:'foods',workout:'workouts',habit:'habits',library:'library'}[a.slice(7)];if(!collection)return;dialog('Delete this item?',`<p class="muted">This removes it from your saved records.</p><div class="dialog-footer">${button('Keep it','close')}<button class="danger" id="confirm-delete">Delete</button></div>`);$('#confirm-delete').onclick=()=>{if(commit(s=>s[collection]=s[collection].filter(x=>x.id!==id))){close();render();notify('Deleted')}}}}catch(err){notify(err.message)}});
document.addEventListener('change',e=>{const b=e.target;if(b.dataset.check){const id=b.dataset.id;if(commit(s=>{if(b.dataset.check==='task'){const task=s.tasks.find(x=>x.id===id);task.done=b.checked;task.completedOn=b.checked?dayKey():null;}else if(b.dataset.check==='step')s.tasks.find(x=>x.id===id).steps[Number(b.dataset.index)].done=b.checked;else{const set=new Set(s.checks[day]||[]);b.checked?set.add(id):set.delete(id);s.checks[day]=[...set]}}))render();else b.checked=!b.checked;}if(b.id==='import-file'){const file=b.files[0];if(!file)return;if(file.size>5e6){notify('Backup is too large (maximum 5 MB).');return}file.text().then(text=>{const incoming=validate(JSON.parse(text));dialog('Restore this backup?',`<p>This will replace current records with ${incoming.tasks.length} tasks, ${incoming.notes.length} notes, and ${incoming.foods.length} meal entries.</p><p class="footnote">Export current data first if you want to keep a copy.</p><div class="dialog-footer">${button('Cancel','close')}<button class="primary" id="confirm-import">Replace and restore</button></div>`);$('#confirm-import').onclick=()=>{if(commit(s=>{for(const k of Object.keys(s))delete s[k];Object.assign(s,incoming)})){close();render();notify('Backup restored')}}}).catch(err=>notify('Cannot import: '+err.message))}});
