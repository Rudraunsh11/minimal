<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today — Minimal</title>
  <style>
    /* Colours, spacing, and layout */
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #292e29;
      background: #f6f7f2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header, main {
      width: min(840px, 100%);
      margin: auto;
      padding: 28px 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #dce1d6;
    }
    .brand { font-size: 25px; font-weight: 750; }
    .badge, .eyebrow {
      font-size: 13px;
      color: #56634e;
    }
    main { padding-top: 56px; }
    h1 {
      font-size: clamp(34px, 7vw, 52px);
      letter-spacing: -2px;
      margin: 12px 0;
    }
    .intro { color: #62685f; line-height: 1.6; }
    section {
      background: #fff;
      padding: 24px;
      margin-top: 32px;
      border: 1px solid #dce1d6;
      border-radius: 20px;
    }
    h2 { font-size: 20px; margin: 0 0 20px; }
    form { display: flex; gap: 10px; }
    input, button { font: inherit; }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #a4af9a;
      border-radius: 10px;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #42573b;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #30432a; }
    :focus-visible { outline: 3px solid #8b6fb0; outline-offset: 3px; }
    ul { list-style: none; padding: 0; margin: 18px 0 0; }
    li { border-top: 1px solid #edf0e9; }
    li label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 0;
      overflow-wrap: anywhere;
    }
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      accent-color: #42573b;
    }
    input:checked + span {
      text-decoration: line-through;
      color: #73786e;
    }
    .hint { font-size: 14px; color: #62685f; line-height: 1.6; }
    @media (max-width: 480px) {
      form { flex-direction: column; }
      section { padding: 20px; }
    }
        /* Place the task and its Delete button beside each other. */
    li {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    li label {
      flex: 1;
      min-width: 0;
    }

    .delete-task {
      flex-shrink: 0;
      min-height: 44px;
      padding: 10px;
      background: transparent;
      color: #805044;
    }

    .delete-task:hover {
      background: #faf0ec;
    }
    .task-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .edit-task, .cancel-edit {
      background: transparent; color: #42573b;
      min-height: 44px; padding: 10px;
    }
    .edit-task:hover, .cancel-edit:hover { background: #edf0e9; }
    .task-editor { width: 100%; padding: 12px 0; flex-wrap: wrap; }
    .task-editor input { flex-basis: 180px; }
    @media (max-width: 480px) {
      li { flex-wrap: wrap; gap: 0; }
      li label { flex-basis: 100%; }
      .task-actions { margin-left: auto; margin-bottom: 8px; }
      .task-editor input { flex-basis: auto; }
    }
  </style>
</head>
<body>
  <header>
    <span class="brand">minimal.</span>
    <span class="badge">Your daily space</span>
  </header>

  <main>
    <p class="eyebrow" id="date"></p>
    <h1>A little more space<br>for your day.</h1>
    <p class="intro">
      Start with what matters. Take the rest one step at a time.
    </p>

    <section aria-labelledby="tasks-heading">
      <h2 id="tasks-heading">Your priorities</h2>
      <form id="task-form">
        <input
          id="task-input"
          type="text"
          aria-label="New priority"
          placeholder="What would you like to do?"
          maxlength="160"
          required
        >
        <button type="submit">Add task</button>
      </form>
      <ul id="task-list"></ul>
      <p class="hint" id="status" role="status">
        Add your first priority above.
      </p>
    </section>

   <p class="hint" id="storage-message" role="status">
      Tasks are stored in this browser only. No account sync yet.
    </p>
  </main>

  <script>
    document.getElementById("date").textContent =
      new Intl.DateTimeFormat(undefined, {
        weekday: "long",
        month: "long",
        day: "numeric"
      }).format(new Date());

    const form = document.getElementById("task-form");
    const input = document.getElementById("task-input");
    const list = document.getElementById("task-list");
    const status = document.getElementById("status");
    const storageMessage = document.getElementById("storage-message");

    // This name identifies our saved checklist in this browser.
    const storageKey = "minimal.tasks.v1";
    let tasks = [];
    let canSave = true;

    // Read previously saved tasks when the page opens.
    try {
      const saved = localStorage.getItem(storageKey);

      if (saved !== null) {
        const parsed = JSON.parse(saved);

        const valid = Array.isArray(parsed) && parsed.every(task =>
          task !== null &&
          typeof task === "object" &&
          typeof task.text === "string" &&
          typeof task.done === "boolean"
        );

        if (!valid) throw new Error("Invalid task data");
        tasks = parsed;
      }
    } catch (error) {
      canSave = false;
      storageMessage.textContent =
        "Saved tasks could not be read. Changes will last only " +
        "until you close or refresh this page.";
    }

    function saveTasks() {
      if (!canSave) return;

      try {
        localStorage.setItem(storageKey, JSON.stringify(tasks));
        storageMessage.textContent =
          "Saved in this browser only. No account sync yet.";
      } catch (error) {
        storageMessage.textContent =
          "Your latest changes could not be saved. " +
          "Keep this page open to avoid losing them.";
      }
    }

    function updateProgress() {
      const done = tasks.filter(task => task.done).length;

      status.textContent = tasks.length
        ? `${done} of ${tasks.length} priorities complete`
        : "Add your first priority above.";
    }

    function renderTasks() {
      list.replaceChildren();

      tasks.forEach(task => {
        const item = document.createElement("li");
        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        const text = document.createElement("span");
        const deleteButton = document.createElement("button");

        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        text.textContent = task.text;

        checkbox.addEventListener("change", function () {
          task.done = checkbox.checked;
          saveTasks();
          updateProgress();
        });

        deleteButton.type = "button";
        deleteButton.className = "delete-task";
        deleteButton.textContent = "Delete";
        deleteButton.setAttribute("aria-label", `Delete ${task.text}`);

        deleteButton.addEventListener("click", function () {
          tasks = tasks.filter(entry => entry !== task);
          saveTasks();
          renderTasks();
          input.focus();
        });

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "edit-task";
        editButton.textContent = "Edit";
        editButton.setAttribute("aria-label", `Edit ${task.text}`);

        editButton.addEventListener("click", function () {
          const editor = document.createElement("form");
          editor.className = "task-editor";
          const field = document.createElement("input");
          field.type = "text";
          field.value = task.text;
          field.maxLength = 160;
          field.required = true;
          field.setAttribute("aria-label", "Task name");

          const saveButton = document.createElement("button");
          saveButton.type = "submit";
          saveButton.textContent = "Save";
          const cancelButton = document.createElement("button");
          cancelButton.type = "button";
          cancelButton.className = "cancel-edit";
          cancelButton.textContent = "Cancel";

          function closeEditor() {
            item.replaceChildren(label, actions);
            editButton.focus();
          }

          editor.addEventListener("submit", function (event) {
            event.preventDefault();
            const name = field.value.trim();
            if (!name) {
              field.setCustomValidity("Enter a task name.");
              field.reportValidity();
              return;
            }
            task.text = name;
            text.textContent = name;
            editButton.setAttribute("aria-label", `Edit ${name}`);
            deleteButton.setAttribute("aria-label", `Delete ${name}`);
            saveTasks();
            closeEditor();
          });
          field.addEventListener("input", function () {
            field.setCustomValidity("");
          });
          editor.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
              event.preventDefault();
              closeEditor();
            }
          });
          cancelButton.addEventListener("click", closeEditor);
          editor.append(field, saveButton, cancelButton);
          item.replaceChildren(editor);
          field.focus();
          field.select();
        });

        const actions = document.createElement("div");
        actions.className = "task-actions";
        actions.append(editButton, deleteButton);
        label.append(checkbox, text);
        item.append(label, actions);
        list.append(item);
      });

      updateProgress();
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      tasks.push({ text: text, done: false });
      saveTasks();
      renderTasks();

      input.value = "";
      input.focus();
    });

    renderTasks();
  </script>
</body>
</html>
